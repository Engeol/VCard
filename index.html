<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engeol Vega - Camera Department</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { text-align: center; border: 1px solid #333; padding: 40px; border-radius: 24px; background: #111; width: 85%; max-width: 350px; }
        h1 { font-size: 1.7rem; margin: 0 0 10px; letter-spacing: -0.03em; }
        p { font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 16px 32px; background: #fff; color: #000; font-weight: bold; text-decoration: none; border-radius: 50px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.96); }
        .hint { margin-top: 20px; font-size: 0.75rem; color: #444; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Engeol Vega</h1>
        <p>Camera Department</p>
        <div id="downloadBtn" class="btn">ADD TO CONTACTS</div>
        <div class="hint">If preview appears, tap the Share icon and select 'Contacts'</div>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            fetch('Engeol.vcf')
                .then(resp => resp.blob())
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'Engeol.vcf';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                })
                .catch(() => alert('Error loading contact file.'));
        });
    </script>
</body>
</html>
