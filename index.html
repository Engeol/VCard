<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engeol Vega - Camera Department</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { text-align: center; border: 1px solid #333; padding: 40px; border-radius: 24px; background: #111; width: 85%; max-width: 350px; }
        h1 { font-size: 1.8rem; margin: 0 0 10px; letter-spacing: -0.03em; }
        p { font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 35px; }
        .btn { display: inline-block; padding: 18px 36px; background: #fff; color: #000; font-weight: bold; text-decoration: none; border-radius: 50px; cursor: pointer; }
        .hint { margin-top: 25px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Engeol Vega</h1>
        <p>Camera Department</p>
        <a id="vcardLink" class="btn">ADD TO CONTACTS</a>
        <div class="hint">Open in Safari/Chrome for direct import</div>
    </div>

    <script>
        // Sustituye los datos de abajo por tus datos reales
        const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Engeol Vega
ORG:Camera Department
TITLE:2nd Assistant Camera
TEL;TYPE=CELL:+34000000000
URL:https://engeol.github.io/VCard/
END:VCARD`;

        const blob = new Blob([vcardData], { type: 'text/vcard' });
        const url = window.URL.createObjectURL(blob);
        const link = document.getElementById('vcardLink');
        link.href = url;
        link.download = 'Engeol.vcf';
    </script>
</body>
</html>
